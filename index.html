<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Insurance Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #f8fafc;
            overflow-x: hidden !important;
            width: 100%;
        }
        input[type="date"] {
            -webkit-appearance: none;
            appearance: none;
            min-height: 44px;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="text-slate-800 pb-12 antialiased select-none">

    <!-- Fixed Sticky Header -->
    <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md text-white pt-3.5 pb-3 px-4 shadow-md border-b border-slate-800/80">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-teal-500/20 border border-teal-400/30 flex items-center justify-center text-teal-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wide">Insurance Dashboard</h1>
                    <p class="text-[11px] text-slate-400 font-medium">متابعة صرف وصفات التأمين الدورية</p>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-2">
                <button onclick="exportToExcel()" title="تصدير النتائج المعروضة إلى Excel" class="w-9 h-9 rounded-xl bg-slate-700/60 hover:bg-slate-700 border border-slate-600 flex items-center justify-center text-slate-200 transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                </button>
            </div>
        </div>

        <!-- Action Button Bar -->
        <div class="max-w-2xl mx-auto mt-3">
            <button onclick="openAddModal()" class="w-full bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-700 hover:to-blue-700 active:scale-[0.99] text-white font-bold py-2.5 px-4 rounded-xl shadow-sm flex items-center justify-center gap-2 text-xs transition-all border border-sky-400/30">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span>إضافة وصفة جديدة</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-3.5 mt-3 space-y-3">

        <!-- Due Alert Banner -->
        <div id="alertBanner" class="bg-rose-50 border border-rose-200 text-rose-800 rounded-2xl p-3 flex items-center justify-between shadow-sm transition-all hidden">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping"></span>
                <p class="text-xs font-bold" id="alertBannerText">تنبيه: يوجد وصفات مستحقة أو متأخرة الصرف حالياً.</p>
            </div>
            <button onclick="filterStatus('due')" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-sm transition-all active:scale-95">عرض</button>
        </div>

        <!-- KPI 3-Cards Summary -->
        <div class="grid grid-cols-3 gap-2">
            <div class="bg-white border border-slate-200/80 rounded-2xl p-2.5 text-center shadow-sm">
                <div class="text-[11px] text-slate-500 font-semibold mb-0.5">إجمالي الوصفات</div>
                <div class="text-lg font-extrabold text-slate-800" id="totalCount">0</div>
            </div>
            <div class="bg-white border border-rose-200/80 rounded-2xl p-2.5 text-center shadow-sm">
                <div class="text-[11px] text-rose-600 font-semibold mb-0.5">متأخرة ومستحقة</div>
                <div class="text-lg font-extrabold text-rose-600" id="dueCount">0</div>
            </div>
            <div class="bg-white border border-emerald-200/80 rounded-2xl p-2.5 text-center shadow-sm">
                <div class="text-[11px] text-emerald-600 font-semibold mb-0.5">لم يحن موعدها</div>
                <div class="text-lg font-extrabold text-emerald-600" id="validCount">0</div>
            </div>
        </div>

        <!-- Search & Filter Controls -->
        <div class="bg-white border border-slate-200/80 rounded-2xl p-3 shadow-sm space-y-2.5">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="ابحث برقم الهوية / الإقامة" oninput="applyFilters()" class="w-full bg-slate-50 border border-slate-200 rounded-xl pr-9 pl-3 py-2 text-xs text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-sky-500 transition-colors">
                <svg class="w-4 h-4 text-slate-400 absolute right-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            
            <div class="flex items-center gap-2">
                <select id="companyFilter" onchange="applyFilters()" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-700 focus:outline-none focus:border-sky-500">
                    <option value="">كل الشركات</option>
                    <option value="تكافل الراجحي">تكافل الراجحي</option>
                    <option value="بوبا">بوبا</option>
                    <option value="التعاونية">التعاونية</option>
                    <option value="ميدغلف">ميدغلف</option>
                </select>

                <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl text-[11px] font-bold">
                    <button onclick="filterStatus('all')" id="tabAll" class="px-2.5 py-1 rounded-lg bg-white text-slate-800 shadow-xs transition-all">الكل</button>
                    <button onclick="filterStatus('due')" id="tabDue" class="px-2.5 py-1 rounded-lg text-slate-500 transition-all">المستحقة</button>
                    <button onclick="filterStatus('valid')" id="tabValid" class="px-2.5 py-1 rounded-lg text-slate-500 transition-all">لم يحن موعدها</button>
                </div>
            </div>
        </div>

        <!-- Prescriptions Container -->
        <div id="prescriptionsContainer" class="space-y-2"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-10 bg-white border border-slate-200/80 rounded-2xl p-6">

            <p class="text-xs text-slate-500 font-semibold">لا توجد وصفات تطابق خيارات البحث</p>
        </div>
    </main>

    <!-- Modal: Add / Edit Prescription -->

                    <span>بيانات الوصفة</span>
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition-colors">

                </button>
            </div>

            <form id="prescriptionForm" onsubmit="handleFormSubmit(event)" class="p-4 space-y-3 overflow-y-auto custom-scrollbar text-xs">
                <input type="hidden" id="editIndex" value="-1">

                <div>

                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-700 font-bold mb-1">رقم الهوية / الإقامة *</label>

                    </div>
                    <div>
                        <label class="block text-slate-700 font-bold mb-1">شركة التأمين *</label>

                            <option value="بوبا">بوبا</option>
                            <option value="التعاونية">التعاونية</option>
                            <option value="ميدغلف">ميدغلف</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-700 font-bold mb-1">رقم الجوال</label>
                        <input type="tel" id="phoneNumber" placeholder="05XXXXXXXX" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-slate-700 font-bold mb-1">الدورة التأمينية *</label>
                        <select id="cycleDuration" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 text-xs focus:outline-none focus:border-sky-500">
                            <option value="84" selected>84 يوم</option>
                            <option value="28">28 يوم</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-slate-700 font-bold mb-1">تاريخ آخر صرف *</label>
                    <input type="date" id="dispenseDate" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-sky-500">
                </div>

                <div>
                    <label class="block text-slate-700 font-bold mb-1">الملاحظات</label>
                    <input type="text" id="patientRemarks" placeholder="أي ملاحظات للمتابعة الصيدلانية" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-sky-500">
                </div>

                <div>
                    <label class="block text-slate-700 font-bold mb-1">قائمة الأدوية والمستلزمات *</label>
                    <textarea id="medicationsList" rows="3" required placeholder="مثال:&#10;Glucophage 500mg&#10;Januvia 100mg" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs focus:outline-none focus:border-sky-500 leading-relaxed"></textarea>
                </div>

                <div class="pt-2 flex items-center justify-end gap-2 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-semibold transition-colors">إلغاء</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold transition-all shadow-sm">حفظ الوصفة</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Delete Confirmation -->
    <div id="deleteConfirmModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-4 text-center space-y-3">
            <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </div>
            <h4 class="font-bold text-slate-800 text-sm">تأكيد حذف الوصفة</h4>
            <p class="text-xs text-slate-500 leading-relaxed" id="deleteModalMessage">هل أنت متأكد من حذف هذه الوصفة نهائياً من المنظومة؟</p>
            <div class="flex items-center justify-center gap-2 pt-2">
                <button onclick="closeDeleteModal()" class="flex-1 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-colors">إلغاء</button>
                <button onclick="executeDelete()" class="flex-1 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs transition-colors shadow-sm">نعم، احذف</button>
            </div>
        </div>
    </div>

        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>

    </div>

        let patients = [];
        let currentStatusFilter = 'all';
        let deleteTargetIndex = null;

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('insurance_patients_db');
            if (saved) {
                try {
                    patients = JSON.parse(saved);
                } catch(e) {
                    patients = initialPatients;
                }
            } else {
                patients = initialPatients;
                saveToStorage();
            }
            renderList();
        });

        function saveToStorage() {
            localStorage.setItem('insurance_patients_db', JSON.stringify(patients));
        }

        function formatDateToDisplay(isoDateStr) {
            if (!isoDateStr) return '';
            const parts = isoDateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]} - ${parts[1]} - ${parts[0]}`;
            }
            return isoDateStr;
        }

        function getTwoPartName(fullName) {
            if (!fullName) return '';
            const parts = fullName.trim().split(/\s+/);
            if (parts.length <= 2) return fullName;
            return `${parts[0]} ${parts[parts.length - 1]}`;
        }

        function getPrescriptionStatus(dispenseDateStr, cycleDays) {
            const now = new Date();
            now.setHours(0, 0, 0, 0);

            const dispenseDate = new Date(dispenseDateStr);
            dispenseDate.setHours(0, 0, 0, 0);

            const dueDate = new Date(dispenseDate);
            dueDate.setDate(dueDate.getDate() + parseInt(cycleDays, 10));

            const diffTime = dueDate.getTime() - now.getTime();
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            const dueDateISO = dueDate.toISOString().split('T')[0];
            const dueDateFormatted = formatDateToDisplay(dueDateISO);

            if (diffDays < 0) {
                return {
                    diffDays: diffDays,
                    state: 'overdue',
                    text: `متأخر (${Math.abs(diffDays)} يوم)`,
                    cssBadge: 'bg-rose-50 text-rose-700 border-rose-200',
                    isDue: true,
                    dueDate: dueDateFormatted,
                    dueDateISO: dueDateISO
                };
            } else if (diffDays === 0) {
                return {
                    diffDays: diffDays,
                    state: 'today',
                    text: `مستحق اليوم`,
                    cssBadge: 'bg-rose-600 text-white border-rose-600 font-bold',
                    isDue: true,
                    dueDate: dueDateFormatted,
                    dueDateISO: dueDateISO
                };
            } else if (diffDays <= 4) {
                return {
                    diffDays: diffDays,
                    state: 'due_soon',
                    text: `متبقي ${diffDays} يوم`,
                    cssBadge: 'bg-amber-50 text-amber-700 border-amber-200 font-bold',
                    isDue: true,
                    dueDate: dueDateFormatted,
                    dueDateISO: dueDateISO
                };
            } else {
                return {
                    diffDays: diffDays,
                    state: 'valid',
                    text: `متبقي ${diffDays} يوم`,
                    cssBadge: 'bg-emerald-50 text-emerald-700 border-emerald-200',
                    isDue: false,
                    dueDate: dueDateFormatted,
                    dueDateISO: dueDateISO
                };
            }
        }

        // Get currently filtered & sorted items
        function getFilteredAndSortedItems() {
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
            const compVal = document.getElementById('companyFilter').value;

            const items = patients.map((patient, originalIndex) => {
                const status = getPrescriptionStatus(patient.dispenseDate, patient.cycle || 84);
                return { patient, originalIndex, status };
            });

            // Sorting: Overdue -> Today -> Remaining 1..4 -> Valid
            items.sort((a, b) => a.status.diffDays - b.status.diffDays);

            return items.filter(({ patient, status }) => {
                const matchSearch = !searchVal || (patient.id && patient.id.toLowerCase().includes(searchVal));
                const matchComp = !compVal || patient.company === compVal;

                let matchStatus = true;
                if (currentStatusFilter === 'due') matchStatus = status.isDue;
                if (currentStatusFilter === 'valid') matchStatus = !status.isDue;

                return matchSearch && matchComp && matchStatus;
            });
        }

        function renderList() {
            const container = document.getElementById('prescriptionsContainer');
            container.innerHTML = '';

            let total = patients.length;
            let dueCount = 0;
            let validCount = 0;

            patients.forEach(patient => {
                const status = getPrescriptionStatus(patient.dispenseDate, patient.cycle || 84);
                if (status.isDue) dueCount++;
                else validCount++;
            });

            const filteredItems = getFilteredAndSortedItems();

            filteredItems.forEach(({ patient, originalIndex, status }) => {
                const card = createCustomerCard(patient, originalIndex, status);
                container.appendChild(card);
            });

            document.getElementById('totalCount').textContent = total;
            document.getElementById('dueCount').textContent = dueCount;
            document.getElementById('validCount').textContent = validCount;

            const alertBanner = document.getElementById('alertBanner');
            if (dueCount > 0) {
                alertBanner.classList.remove('hidden');
                document.getElementById('alertBannerText').textContent = `تنبيه: يوجد ${dueCount} وصفة مستحقة أو متأخرة الصرف حالياً.`;
            } else {
                alertBanner.classList.add('hidden');
            }

            document.getElementById('emptyState').classList.toggle('hidden', filteredItems.length > 0);
        }

        function createCustomerCard(patient, index, status) {
            const card = document.createElement('div');
            card.className = `bg-white rounded-2xl border border-slate-200/90 hover:border-slate-300 shadow-2xs transition-all overflow-hidden`;

            const twoName = getTwoPartName(patient.name);
            const medsListHtml = (patient.meds || []).map(m => `<li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span><span>${m}</span></li>`).join('');
            const displayDispenseDate = formatDateToDisplay(patient.dispenseDate);

            card.innerHTML = `
                <div onclick="toggleCard(${index})" class="p-3.5 sm:p-4 min-h-[82px] cursor-pointer flex items-center justify-between gap-2.5">
                    <div class="text-right flex-1 min-w-0 pl-2">
                        <h3 class="text-xs sm:text-sm font-bold text-slate-900 truncate">${twoName}</h3>
                        <p class="text-[11px] text-slate-500 font-mono mt-1">الهوية: ${patient.id}</p>
                    </div>

                    <div class="flex items-center gap-2 flex-shrink-0">
                        <span class="text-[11px] font-bold text-teal-800 bg-teal-50 border border-teal-200 px-2 py-1 rounded-xl">
                            ${patient.company || 'تأمين'}
                        </span>
                        <span class="text-[11px] px-2.5 py-1 rounded-xl border font-bold ${status.cssBadge}">
                            ${status.text}
                        </span>
                        <div id="chevron-${index}" class="w-7 h-7 rounded-xl bg-slate-100 flex items-center justify-center text-slate-500 transition-transform duration-200">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <div id="details-${index}" class="hidden border-t border-slate-100 bg-slate-50/50 p-4 space-y-3.5">
                    <div class="bg-amber-50/80 border border-amber-200/90 rounded-2xl p-3">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="text-xs font-bold text-amber-900 flex items-center gap-1.5">
                                <svg class="w-3.5 h-3.5 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                <span>ملاحظة الصيدلي:</span>
                            </span>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="text" id="remark-input-${index}" value="${patient.remarks || ''}" placeholder="اكتب ملاحظة للمتابعة هنا..." class="flex-1 bg-white/90 border border-amber-200 rounded-xl px-2.5 py-1.5 text-xs text-amber-950 focus:outline-none focus:border-amber-400">
                            <button type="button" onclick="saveDirectRemark(${index}, event)" class="bg-amber-600 hover:bg-amber-700 active:scale-95 text-white font-bold text-xs px-3 py-1.5 rounded-xl shadow-xs transition-all flex items-center gap-1 flex-shrink-0">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                                <span>حفظ الملاحظة</span>
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-white p-2.5 rounded-xl border border-slate-200">
                            <span class="text-[10px] text-slate-400 block font-semibold">الاسم بالكامل</span>
                            <span class="font-bold text-slate-800">${patient.name}</span>
                        </div>
                        <div class="bg-white p-2.5 rounded-xl border border-slate-200">
                            <span class="text-[10px] text-slate-400 block font-semibold">رقم الجوال</span>
                            <span class="font-bold text-slate-800 font-mono">${patient.phone || 'غير مسجل'}</span>
                        </div>
                        <div class="bg-white p-2.5 rounded-xl border border-slate-200">
                            <span class="text-[10px] text-slate-400 block font-semibold">تاريخ آخر صرف</span>
                            <span class="font-bold text-slate-800 font-mono">${displayDispenseDate}</span>
                        </div>
                        <div class="bg-white p-2.5 rounded-xl border border-slate-200">
                            <span class="text-[10px] text-slate-400 block font-semibold">تاريخ الاستحقاق</span>
                            <span class="font-bold text-emerald-700 font-mono">${status.dueDate}</span>
                        </div>
                    </div>

                    <div class="bg-white p-3 rounded-2xl border border-slate-200">
                        <div class="text-xs font-bold text-slate-700 mb-1.5">الأدوية والمستلزمات المقررة للدورة:</div>
                        <ul class="text-xs text-slate-600 space-y-1 pr-1 font-medium">
                            ${medsListHtml}
                        </ul>
                    </div>

                    <div class="flex items-center justify-between gap-2 pt-1">
                        <div class="flex items-center gap-1.5">
                            <button onclick="promptDelete(${index}, event)" title="حذف الوصفة" class="w-8 h-8 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 flex items-center justify-center transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                            <button onclick="openEditModal(${index}, event)" title="تعديل الوصفة" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-200 flex items-center justify-center transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            </button>
                        </div>

                        <button onclick="renewDispenseToday(${index}, event)" class="flex-1 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white font-bold text-xs py-2 px-3 rounded-xl shadow-xs transition-all flex items-center justify-center gap-1.5 active:scale-[0.98]">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            <span>تم صرف دورة جديدة اليوم</span>
                        </button>
                    </div>
                </div>
            `;
            return card;
        }

        function toggleCard(index) {
            const details = document.getElementById(`details-${index}`);
            const chevron = document.getElementById(`chevron-${index}`);
            if (details.classList.contains('hidden')) {
                details.classList.remove('hidden');
                chevron.classList.add('rotate-180');
            } else {
                details.classList.add('hidden');
                chevron.classList.remove('rotate-180');
            }
        }

        function renewDispenseToday(index, event) {
            event.stopPropagation();
            const todayStr = new Date().toISOString().split('T')[0];
            patients[index].dispenseDate = todayStr;
            saveToStorage();
            renderList();
            showToast(`تم تجديد دورة الصرف للمريض (${getTwoPartName(patients[index].name)}) بدءاً من اليوم`);
        }

        function saveDirectRemark(index, event) {
            if (event) event.stopPropagation();
            const input = document.getElementById(`remark-input-${index}`);
            if (input && patients[index]) {
                patients[index].remarks = input.value.trim();
                saveToStorage();
                showToast(`تم حفظ الملاحظة لـ (${getTwoPartName(patients[index].name)}) بنجاح 💾`);
            }
        }

        function promptDelete(index, event) {
            event.stopPropagation();
            deleteTargetIndex = index;
            const p = patients[index];
            document.getElementById('deleteModalMessage').textContent = `هل أنت متأكد من حذف وصفة المريض (${getTwoPartName(p.name)}) نهائياً؟`;
            document.getElementById('deleteConfirmModal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            deleteTargetIndex = null;
            document.getElementById('deleteConfirmModal').classList.add('hidden');
        }

        function executeDelete() {
            if (deleteTargetIndex !== null && patients[deleteTargetIndex]) {
                const deletedName = getTwoPartName(patients[deleteTargetIndex].name);
                patients.splice(deleteTargetIndex, 1);
                saveToStorage();
                closeDeleteModal();
                renderList();
                showToast(`تم حذف وصفة (${deletedName}) بنجاح`);
            }
        }

        function filterStatus(status) {
            currentStatusFilter = status;
            ['tabAll', 'tabDue', 'tabValid'].forEach(id => {
                const btn = document.getElementById(id);
                btn.className = "px-2.5 py-1 rounded-lg text-slate-500 transition-all";
            });

            if (status === 'all') document.getElementById('tabAll').className = "px-2.5 py-1 rounded-lg bg-white text-slate-800 shadow-xs transition-all font-bold";
            if (status === 'due') document.getElementById('tabDue').className = "px-2.5 py-1 rounded-lg bg-white text-rose-600 shadow-xs transition-all font-bold";
            if (status === 'valid') document.getElementById('tabValid').className = "px-2.5 py-1 rounded-lg bg-white text-emerald-600 shadow-xs transition-all font-bold";

            renderList();
        }

        function applyFilters() {
            renderList();
        }

        function openAddModal() {
            document.getElementById('editIndex').value = "-1";
            document.getElementById('modalTitle').querySelector('span').textContent = "إضافة وصفة جديدة";
            document.getElementById('prescriptionForm').reset();
            document.getElementById('cycleDuration').value = "84";
            document.getElementById('dispenseDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('prescriptionModal').classList.remove('hidden');
        }

        function openEditModal(index, event) {
            event.stopPropagation();
            const p = patients[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('modalTitle').querySelector('span').textContent = "تعديل بيانات الوصفة";
            
            document.getElementById('patientName').value = p.name || '';
            document.getElementById('nationalId').value = p.id || '';
            document.getElementById('insuranceCompany').value = p.company || 'تكافل الراجحي';
            document.getElementById('phoneNumber').value = p.phone || '';
            document.getElementById('cycleDuration').value = p.cycle || '84';
            document.getElementById('dispenseDate').value = p.dispenseDate || '';
            document.getElementById('patientRemarks').value = p.remarks || '';
            document.getElementById('medicationsList').value = (p.meds || []).join('\n');

            document.getElementById('prescriptionModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('prescriptionModal').classList.add('hidden');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const idx = parseInt(document.getElementById('editIndex').value, 10);
            const meds = document.getElementById('medicationsList').value.split('\n').map(m => m.trim()).filter(Boolean);

            const newPatientData = {
                name: document.getElementById('patientName').value.trim(),
                id: document.getElementById('nationalId').value.trim(),
                company: document.getElementById('insuranceCompany').value,
                phone: document.getElementById('phoneNumber').value.trim(),
                cycle: parseInt(document.getElementById('cycleDuration').value, 10) || 84,
                dispenseDate: document.getElementById('dispenseDate').value,
                remarks: document.getElementById('patientRemarks').value.trim(),
                meds: meds
            };

            if (idx >= 0) {
                patients[idx] = newPatientData;
                showToast('تم تحديث بيانات الوصفة بنجاح');
            } else {
                patients.unshift(newPatientData);
                showToast('تمت إضافة الوصفة الجديدة بنجاح');
            }

            saveToStorage();
            closeModal();
            renderList();
        }

        // Custom Export: Exports ONLY the currently filtered/displayed items
        function exportToExcel() {
            const filteredItems = getFilteredAndSortedItems();

            if (!filteredItems.length) {
                alert('لا توجد وصفات تطابق التصفية الحالية لتصديرها.');
                return;
            }

            let csvContent = "\uFEFFم,رقم الهوية / الإقامة,اسم العميل,شركة التأمين,رقم الجوال,مدة الدورة,تاريخ آخر صرف,تاريخ الاستحقاق,الحالة,الأدوية,الملاحظات\n";

            filteredItems.forEach(({ patient, status }, idx) => {
                const medsString = (patient.meds || []).join(' | ').replace(/"/g, '""');
                const displayDispenseDate = formatDateToDisplay(patient.dispenseDate);
                const row = [
                    idx + 1,
                    `"${patient.id || ''}"`,
                    `"${patient.name || ''}"`,
                    `"${patient.company || ''}"`,
                    `"${patient.phone || ''}"`,
                    patient.cycle || 84,
                    `"${displayDispenseDate}"`,
                    `"${status.dueDate}"`,
                    `"${status.text}"`,
                    `"${medsString}"`,
                    `"${(patient.remarks || '').replace(/"/g, '""')}"`
                ];
                csvContent += row.join(",") + "\n";
            });

            // Dynamic filename based on applied filters
            const compVal = document.getElementById('companyFilter').value;
            let statusSuffix = "الكل";
            if (currentStatusFilter === 'due') statusSuffix = "المستحقة";
            if (currentStatusFilter === 'valid') statusSuffix = "غير_المستحقة";

            const companyPart = compVal ? compVal.replace(/\s+/g, '_') : 'كل_الشركات';
            const todayStr = formatDateToDisplay(new Date().toISOString().split('T')[0]).replace(/\s+/g, '');
            const fileName = `Insurance_${companyPart}_${statusSuffix}_${todayStr}.csv`;

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast(`تم تصدير ${filteredItems.length} وصفة إلى إكسيل بنجاح 📊`);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.remove('opacity-0', 'translate-y-3', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-3', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
